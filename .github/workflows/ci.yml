name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install SFML
      run: |
        sudo apt-get update
        sudo apt-get install -y libsfml-dev
        
    - name: Install Meson and Ninja
      run: |
        pip install meson ninja
        
    - name: Configure with Meson
      run: |
        meson setup build --buildtype=release
        
    - name: Build
      run: |
        ninja -C build
        
    - name: Run tests
      run: |
        meson test -C build